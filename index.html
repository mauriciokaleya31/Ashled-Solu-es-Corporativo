    <script>
      // Safe guard for sandboxed iframe environments where window.fetch has only a getter
      (function () {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return customFetch || originalFetch;
              },
              set: function (fn) {
                customFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e) {
            // fallback if Object.defineProperty is locked
          }
        } catch (err) {
          // ignore
        }
      })();
    </script>
